[package]
name = "rivals-swapper"
version = "2.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[dependencies]
aes = "0.8"
anyhow = "1"
cityhasher = "0.1"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["file", "image"] }
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "tga"] }
open = "5.4.4"
rayon = "1.12.0"
regex = "1.13.1"
# Rivals paks use a modified format (byte-swapped AES blocks); upstream repak can't read them.
repak = { git = "https://github.com/natimerry/repak-rivals", rev = "7932c3ab6096b80fb3b5de3e1e423d44adbecc82", package = "repak", features = ["oodle"] }
retoc = { git = "https://github.com/trumank/retoc", rev = "885a8dae740cb1ce1e41ff2e74f67f9f0c118237" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
ureq = { version = "3.4.2", features = ["json"] }
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true

[target."cfg(unix)".dependencies]
libc = "0.2.190"
