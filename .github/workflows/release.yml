name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  UASSETTOOL_VERSION: "v1.2.0"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            exe: rivals-swapper.exe
            out: RivalsSwapper.exe
            oodle: oo2core_9_win64.dll
            archive: RivalsSwapper-Windows.zip
          - os: ubuntu-latest
            exe: rivals-swapper
            out: RivalsSwapper
            oodle: liboo2corelinux64.so.9
            archive: RivalsSwapper-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev

      - name: Build
        run: cargo build --release --locked

      - name: Download UAssetTool (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sL "https://github.com/XzantGaming/UAssetToolRivals/releases/download/${{ env.UASSETTOOL_VERSION }}/UAssetTool-linux-x64.tar.gz" | tar -xz -C tools/uassettool
          chmod +x tools/uassettool/UAssetTool

      - name: Assemble release folder
        shell: bash
        run: |
          mkdir -p dist/RivalsSwapper/tools
          cp "target/release/${{ matrix.exe }}" "dist/RivalsSwapper/${{ matrix.out }}"
          cp "tools/oodle/${{ matrix.oodle }}" dist/RivalsSwapper/
          cp -r tools/uassettool tools/umodel dist/RivalsSwapper/tools/
          if [ "$RUNNER_OS" = "Windows" ]; then rm -f dist/RivalsSwapper/tools/uassettool/UAssetTool; else rm -f dist/RivalsSwapper/tools/uassettool/UAssetTool.exe; fi

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist\RivalsSwapper\* -DestinationPath dist\${{ matrix.archive }}

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf dist/${{ matrix.archive }} -C dist RivalsSwapper

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: echo "TAG_NAME=v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG_NAME }}
          name: Rivals Swapper ${{ steps.tag.outputs.TAG_NAME }}
          generate_release_notes: true
          files: |
            artifacts/RivalsSwapper-Windows.zip
            artifacts/RivalsSwapper-Linux.tar.gz
